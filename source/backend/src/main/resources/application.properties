# ===============================================
# Averion Coffee - Coffee Shop Management System
# ===============================================
spring.application.name=Averion Coffee
server.port=8080

# --- Database utama: MySQL ---
# Sesuaikan username/password MySQL di bawah ini.
# Database "averion_pos" dibuat otomatis saat aplikasi pertama kali jalan.
# Kalau tidak punya MySQL, jalankan dengan profil h2:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:mysql://localhost:3306/averion_pos?createDatabaseIfNotExist=true&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Semua field JSON dikirim/diterima sebagai snake_case (sesuai tipe data frontend React)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Batas ukuran upload gambar produk
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
